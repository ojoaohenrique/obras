<meta charset="utf-8">
<title>Diário de Obra DG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  color-scheme:light;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"IBM Plex Sans Condensed",var(--font-body);
  --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;

  /* concreto (default) */
  --plane:#eef0ea;
  --surface:#ffffff;
  --surface-2:#f4f5f0;
  --ink:#1c1f1a;
  --ink-soft:#565a50;
  --muted:#8a8d80;
  --line:#d9dbcf;
  --line-strong:#c2c4b6;
  --accent:#235a8f;
  --accent-ink:#ffffff;
  --accent-soft:#e2ecf5;
  --accent-2:#c9781f;
  --bg-pattern:none;
  --shadow:0 1px 2px rgba(20,22,16,.06), 0 4px 14px rgba(20,22,16,.06);

  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
  --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

:root[data-bg="blueprint"]{
  color-scheme:dark;
  --plane:#0c3a5e;
  --surface:#0f4a75;
  --surface-2:#0d4169;
  --ink:#eef6fc;
  --ink-soft:#bcd8ec;
  --muted:#8fb8d6;
  --line:rgba(255,255,255,.22);
  --line-strong:rgba(255,255,255,.34);
  --accent:#ffcb47;
  --accent-ink:#12324a;
  --accent-soft:rgba(255,203,71,.16);
  --accent-2:#8fd0ff;
  --bg-pattern:
    repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 28px);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
}

:root[data-bg="aco"]{
  color-scheme:light;
  --plane:#e6eaed;
  --surface:#ffffff;
  --surface-2:#eef1f3;
  --ink:#1a2430;
  --ink-soft:#54626f;
  --muted:#8996a1;
  --line:#ccd4da;
  --line-strong:#b3bcc3;
  --accent:#3a6ea5;
  --accent-ink:#ffffff;
  --accent-soft:#e4ecf3;
  --accent-2:#6c7a86;
  --bg-pattern:none;
  --shadow:0 1px 2px rgba(15,25,35,.07), 0 4px 14px rgba(15,25,35,.08);
}

:root[data-bg="canteiro"]{
  color-scheme:dark;
  --plane:#14171a;
  --surface:#1c2023;
  --surface-2:#22262a;
  --ink:#f2f1ea;
  --ink-soft:#bcbeb4;
  --muted:#8b8d84;
  --line:rgba(255,255,255,.12);
  --line-strong:rgba(255,255,255,.20);
  --accent:#f2a900;
  --accent-ink:#181a12;
  --accent-soft:rgba(242,169,0,.14);
  --accent-2:#e0562c;
  --bg-pattern:
    repeating-linear-gradient(135deg, rgba(242,169,0,.05) 0 2px, transparent 2px 18px);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.5);
}

:root[data-bg="kraft"]{
  color-scheme:light;
  --plane:#efe6d2;
  --surface:#faf3e2;
  --surface-2:#f2e8d1;
  --ink:#2c2213;
  --ink-soft:#6c5c3d;
  --muted:#948457;
  --line:#dcc9a0;
  --line-strong:#c7b184;
  --accent:#a1442a;
  --accent-ink:#fbf1e2;
  --accent-soft:#ecd8c6;
  --accent-2:#5c7a4c;
  --bg-pattern:none;
  --shadow:0 1px 2px rgba(60,45,15,.10), 0 4px 14px rgba(60,45,15,.10);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--plane);
  background-image:var(--bg-pattern);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;}
p{margin:0;}
button{font-family:inherit;}
img{max-width:100%;display:block;}
svg{width:1em;height:1em;flex:none;}
[hidden]{display:none!important;}
a{color:var(--accent);}
.mono{font-family:var(--font-mono);}
.tabular{font-variant-numeric:tabular-nums;}

/* ============ LAYOUT SHELL ============ */
.app-shell{max-width:1180px;margin:0 auto;padding:0 16px 64px;}

.appbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--surface); border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);
}
.appbar-inner{
  max-width:1180px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brandblock{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-stamp{
  width:42px;height:42px;border-radius:8px;flex:none;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:.02em;
}
.brand-text{min-width:0;}
.brand-text .t1{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.1;letter-spacing:.01em;}
.brand-text .t2{font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;text-transform:uppercase;}

.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto;}
.tab{
  border:none;background:transparent;color:var(--ink-soft);
  font:inherit;font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);}
.tab svg{width:16px;height:16px;flex:none;}

.icon-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:none;position:relative;
}
.icon-btn:hover{border-color:var(--line-strong);}
.icon-btn svg{width:18px;height:18px;}

.mode-pill{
  font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);
  border:1px solid var(--line);display:flex;align-items:center;gap:5px;
}
.mode-pill.local{color:var(--accent-2);border-color:var(--accent-2);}

/* ============ POPOVER (theme picker) ============ */
.popover-wrap{position:relative;flex:none;}
.popover{
  position:absolute;right:0;top:calc(100% + 8px);width:272px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.18);padding:14px;z-index:40;
}
.popover h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:10px;}
.swatch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.swatch{
  border:1.5px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;
  background:var(--surface-2);
}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.swatch .chip{height:28px;border-radius:6px;margin-bottom:6px;}
.swatch .lbl{font-size:12px;font-weight:600;}
.swatch .sub{font-size:10.5px;color:var(--muted);}
.chip-concreto{background:linear-gradient(135deg,#eef0ea,#fff);}
.chip-blueprint{background:linear-gradient(135deg,#0c3a5e,#155a8c);}
.chip-aco{background:linear-gradient(135deg,#e6eaed,#c9d2d8);}
.chip-canteiro{background:linear-gradient(135deg,#14171a,#2c2f22);}
.chip-kraft{background:linear-gradient(135deg,#efe6d2,#e2cfa3);}

/* ============ GENERIC COMPONENTS ============ */
.btn{
  font:inherit;font-weight:600;font-size:13.5px;border-radius:9px;padding:9px 16px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn svg{width:16px;height:16px;}
.btn:hover{border-color:var(--line-strong);}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-danger{color:var(--critical);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
.section-title{font-size:15px;font-weight:700;font-family:var(--font-display);display:flex;align-items:center;gap:8px;}
.section-title svg{width:17px;height:17px;}
.section-sub{font-size:12.5px;color:var(--ink-soft);}

.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);margin-bottom:16px;}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;}
.banner.crit{background:color-mix(in srgb, var(--critical) 12%, var(--surface));border-color:color-mix(in srgb, var(--critical) 40%, var(--line));}
.banner.info{background:var(--accent-soft);border-color:var(--line);}
.banner .b-title{font-weight:700;font-size:13.5px;margin-bottom:2px;}
.banner .b-body{font-size:12.5px;color:var(--ink-soft);}
.banner ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;}

.empty{padding:36px 20px;text-align:center;color:var(--ink-soft);}
.empty svg{width:34px;height:34px;margin:0 auto 10px;opacity:.5;}
.empty .e-title{font-weight:700;color:var(--ink);margin-bottom:4px;}

.demo-badge{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-2);background:var(--accent-soft);border:1px solid var(--accent-2);border-radius:6px;padding:2px 7px;}

/* ============ PAINEL (dashboard) ============ */
.painel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 0 14px;flex-wrap:wrap;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat{padding:16px;display:flex;flex-direction:column;gap:6px;}
.stat .s-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;}
.stat .s-label svg{width:15px;height:15px;}
.stat .s-value{font-family:var(--font-mono);font-size:26px;font-weight:600;line-height:1;}
.stat .s-sub{font-size:12px;color:var(--ink-soft);}
.stat .s-value.warn{color:var(--serious);}
.stat .s-value.crit{color:var(--critical);}

.chart-row{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:18px;align-items:stretch;}
.chart-card{padding:16px 16px 8px;position:relative;}
.chart-card .cc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.chart-card .cc-head h3{font-size:14px;}
.chart-card .cc-head span{font-size:11.5px;color:var(--muted);}
.chart-svg{width:100%;display:block;overflow:visible;}
.bar-rect{transition:opacity .15s;cursor:pointer;}
.bar-rect:hover, .bar-rect:focus{opacity:.82;}
.bar-label{font-family:var(--font-mono);font-size:11px;fill:var(--ink-soft);text-anchor:middle;}
.axis-label{font-family:var(--font-body);font-size:10.5px;fill:var(--muted);text-anchor:middle;}
.gridline{stroke:var(--line);stroke-width:1;}

.viz-tooltip{
  position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);
  font-size:11.5px;font-family:var(--font-mono);padding:5px 9px;border-radius:7px;
  transform:translate(-50%,-100%);white-space:nowrap;z-index:20;opacity:0;transition:opacity .1s;
  box-shadow:0 4px 10px rgba(0,0,0,.25);
}
.viz-tooltip.show{opacity:1;}

.weather-strip{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:4px 2px;}
.w-day{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;min-width:40px;}
.w-day svg{width:20px;height:20px;color:var(--accent);}
.w-day .wd-label{font-size:10px;color:var(--muted);font-family:var(--font-mono);}

/* ============ DIÁRIO (list) ============ */
.month-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-top:14px;scrollbar-width:thin;}
.month-tab{
  flex:none;font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;white-space:nowrap;
}
.month-tab:hover{border-color:var(--accent);color:var(--ink);}
.month-tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.month-tab .mt-count{opacity:.75;margin-left:5px;font-weight:500;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px;}
.filter-bar .grow{flex:1 1 220px;}
.input, .select, textarea{
  width:100%;font:inherit;font-size:13.5px;padding:8px 11px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.input:focus, .select:focus, textarea:focus, .btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px;
}
textarea{resize:vertical;min-height:64px;font-family:var(--font-body);}

.rdo-list{display:flex;flex-direction:column;gap:10px;}
.rdo-card{padding:14px 16px;cursor:pointer;}
.rdo-card:hover{border-color:var(--line-strong);}
.rc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.rc-id{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
.rc-title{font-weight:700;font-size:15px;margin-top:2px;}
.rc-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;}
.rc-meta span{display:inline-flex;align-items:center;gap:4px;}
.rc-meta svg{width:13px;height:13px;}
.rc-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;}
.rc-actions{display:flex;gap:6px;margin-top:8px;}

.status-chip, .severity-chip{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
  border:1px solid transparent;
}
.status-chip svg, .severity-chip svg{width:12px;height:12px;}
.chip-rascunho{background:var(--surface-2);color:var(--ink-soft);border-color:var(--line);}
.chip-emitido{background:color-mix(in srgb, var(--good) 16%, var(--surface));color:color-mix(in srgb, var(--good) 70%, var(--ink));border-color:color-mix(in srgb, var(--good) 40%, var(--line));}
.chip-baixa{background:color-mix(in srgb, var(--good) 14%, var(--surface));color:var(--ink);}
.chip-media{background:color-mix(in srgb, var(--warning) 22%, var(--surface));color:var(--ink);}
.chip-alta{background:color-mix(in srgb, var(--serious) 24%, var(--surface));color:var(--ink);}
.chip-critica{background:color-mix(in srgb, var(--critical) 20%, var(--surface));color:var(--ink);}

.confirm-bar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb, var(--critical) 10%, var(--surface));border:1px solid color-mix(in srgb, var(--critical) 35%, var(--line));border-radius:9px;padding:8px 10px;margin-top:8px;font-size:12.5px;}
.confirm-bar strong{flex:1;}

/* ============ RDO DETAIL ============ */
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0;}
.detail-item{padding:11px 13px;}
.detail-item .di-label{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;}
.detail-item .di-value{font-size:14px;margin-top:2px;display:flex;align-items:center;gap:5px;}
.detail-item .di-value svg{width:14px;height:14px;}
.detail-table{width:100%;border-collapse:collapse;font-size:13px;}
.detail-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);}
.detail-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
.act-block{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2);}
.act-block .ab-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.act-block .ab-desc{font-size:13.5px;margin:4px 0 8px;}
.progress-track{height:6px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;}
.progress-fill{height:100%;border-radius:999px;background:var(--accent);}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px;}
.photo-tile{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:1;background:var(--surface);border:1px solid var(--line);}
.photo-tile img{width:100%;height:100%;object-fit:cover;}
.photo-tile .p-cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top, rgba(0,0,0,.65), transparent);color:#fff;font-size:10px;padding:10px 6px 4px;}
.photo-add-tile{
  aspect-ratio:1;border:1.5px dashed var(--line-strong);border-radius:9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink-soft);font-size:11px;cursor:pointer;background:var(--surface);
}
.photo-add-tile:hover{border-color:var(--accent);color:var(--accent);}
.photo-add-tile svg{width:20px;height:20px;}
.photo-tile .p-remove{
  position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.photo-tile .p-remove svg{width:12px;height:12px;}
.photo-cap-input{width:100%;font-size:11px;padding:4px 6px;margin-top:4px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);}
.desc-photo-row{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start;margin-top:8px;}
.desc-photo-row .field textarea{min-height:118px;height:100%;}
.desc-photo-row .dp-photos{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface-2);}
.desc-photo-row .dp-photos label{display:flex;align-items:center;gap:5px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:6px;}
.desc-photo-row .dp-photos label svg{width:13px;height:13px;}
.desc-photo-row .photo-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));}
@media (max-width:700px){
  .desc-photo-row{grid-template-columns:1fr;}
}

/* ============ FORM VIEW ============ */
.form-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 14px;flex-wrap:wrap;}
.form-section{margin-bottom:16px;padding:16px;}
.form-section h3{font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:7px;}
.form-section .fs-sub{font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;}
.field-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.field-grid.g3{grid-template-columns:repeat(3,1fr);}
.field-grid.g2{grid-template-columns:repeat(2,1fr);}
.span-2{grid-column:span 2;}
.span-4{grid-column:span 4;}

.row-table{width:100%;border-collapse:collapse;}
.row-table th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px 6px;}
.row-table td{padding:4px 6px 4px 0;vertical-align:middle;}
.row-table tr+tr td{padding-top:6px;}
.row-remove{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--critical);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.row-remove svg{width:14px;height:14px;}
.add-row-btn{margin-top:8px;}

.activity-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--surface-2);}
.activity-card .ac-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.activity-card .ac-num{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
.range-row{display:flex;align-items:center;gap:10px;}
.range-row input[type=range]{flex:1;accent-color:var(--accent);}
.range-val{font-family:var(--font-mono);font-weight:600;font-size:13px;width:40px;text-align:right;}

.occ-row{display:grid;grid-template-columns:1fr 150px 40px;gap:8px;margin-bottom:8px;align-items:start;}

.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--plane);padding:14px 0 10px;margin-top:6px;border-top:1px solid var(--line);}
.readonly-note{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:12px;}

.import-card{border:1.5px dashed var(--accent);background:var(--accent-soft);}
.import-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.import-row .import-icon{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);}
.import-row .import-icon svg{width:20px;height:20px;}
.import-text{flex:1;min-width:180px;}
.import-text strong{font-size:13.5px;}
.import-text p{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.spin svg, svg.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.import-log{margin-top:10px;font-size:12.5px;}
.import-log ul{margin:6px 0 0;padding-left:18px;}
.import-log .warn-line{color:var(--serious);}

/* lightbox (ampliar foto) */
.lightbox{
  position:fixed;inset:0;z-index:80;background:rgba(10,12,10,.86);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  cursor:zoom-out;animation:lb-in .15s ease;
}
.lightbox[hidden]{display:none;}
@keyframes lb-in{from{opacity:0;}to{opacity:1;}}
.lightbox img{max-width:min(92vw,1100px);max-height:80vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default;background:#111;}
.lightbox-cap{color:#fff;font-size:13.5px;text-align:center;max-width:80vw;cursor:default;}
.lightbox-toolbar{display:flex;gap:10px;cursor:default;}
.lb-action{
  display:flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:600;
  padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;
  border:1px solid rgba(255,255,255,.28);cursor:pointer;
}
.lb-action:hover{background:rgba(255,255,255,.22);}
.lb-action svg{width:15px;height:15px;}
.lb-action:disabled{opacity:.5;cursor:default;}
.lightbox-close{
  position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:22px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.lightbox-close:hover{background:rgba(255,255,255,.22);}
.photo-tile img, .photo-grid .photo-tile img{cursor:zoom-in;}

/* toast */
.toast-wrap{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--ink);color:var(--surface);font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(6px);transition:all .2s;}
.toast.show{opacity:1;transform:translateY(0);}

/* responsive */
@media (max-width:860px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .chart-row{grid-template-columns:1fr;}
  .field-grid, .field-grid.g3, .field-grid.g2{grid-template-columns:repeat(2,1fr);}
  .span-4{grid-column:span 2;}
  .span-2{grid-column:span 2;}
  .detail-grid{grid-template-columns:1fr;}
}
@media (max-width:520px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .field-grid, .field-grid.g3, .field-grid.g2{grid-template-columns:1fr;}
  .span-4, .span-2{grid-column:span 1;}
  .occ-row{grid-template-columns:1fr;}
  .tabs .tab-label{display:none;}
  .brand-text .t2{display:none;}
  .popover{right:-8px;width:calc(100vw - 32px);max-width:300px;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;}
}

/* =========================================================================

function uid(){return 'k'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayISO(){const d=new Date();const off=d.getTimezoneOffset();const local=new Date(d.getTime()-off*60000);return local.toISOString().slice(0,10);}
function fmtDateLong(iso){
  if(!iso) return '—';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  const wd=d.toLocaleDateString('pt-BR',{weekday:'short'});
  const dm=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  return dm+' · '+wd.replace('.','').replace(/^./,c=>c.toUpperCase());
}
function fmtMonthLabel(iso){
  const d=new Date((iso||todayISO())+'T00:00:00');
  return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
}
function monthKey(iso){return (iso||'').slice(0,7);}
function toast(msg, tone){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  if(tone==='err') el.style.background='var(--critical)';
  wrap.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show'); setTimeout(()=>el.remove(),250);},2600);
}
function blobUrl(id){
  if(_localBlobUrlCache[id]) return _localBlobUrlCache[id];
  // Fotos que já vieram pré-carregadas neste pacote (não anexadas nesta sessão do
  // navegador) ficam como arquivos estáticos em ./photos/<id>.jpg, ao lado deste HTML.
  if(typeof id==='string' && id.indexOf('local_')!==0) return './photos/'+id+'.jpg';
  return '/_blob/'+id;
}
let lightboxId=null, lightboxLegenda='';
function openLightbox(id, legenda){
  const box=document.getElementById('lightbox');
  lightboxId=id; lightboxLegenda=legenda||'';
  document.getElementById('lightboxImg').src = blobUrl(id);
  document.getElementById('lightboxCap').textContent = legenda||'';
  document.getElementById('lightboxToolbar').innerHTML = `
    <button class="lb-action" onclick="copyPhotoToClipboard()">${ic('copy')} Copiar</button>
    <button class="lb-action" onclick="downloadPhoto()">${ic('download')} Baixar</button>
  `;
  box.hidden=false;
}
function closeLightbox(){
  document.getElementById('lightbox').hidden=true;
  document.getElementById('lightboxImg').src='';
  lightboxId=null; lightboxLegenda='';
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const box=document.getElementById('lightbox'); if(box && !box.hidden) closeLightbox(); }
});
async function fetchPhotoBlob(id){
  const res = await fetch(blobUrl(id));
  if(!res.ok) throw new Error('não foi possível carregar a foto');
  return await res.blob();
}
function extFromMime(type){
  return ({'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'})[type] || 'jpg';
}
function slugify(s){
  return normText(s).replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,40) || 'foto';
}
async function downloadPhoto(id, legenda){
  id = id || lightboxId; legenda = legenda!=null ? legenda : lightboxLegenda;
  if(!id){ return; }
  try{

    if(downloadsCap){

      }
    }

async function copyPhotoToClipboard(){
  if(!lightboxId) return;
  if(!navigator.clipboard || typeof ClipboardItem==='undefined'){
    toast('Copiar não é suportado neste navegador — use Baixar.', 'err');
    return;
  }
  try{
    const blob = await fetchPhotoBlob(lightboxId);
    const pngBlob = blob.type==='image/png' ? blob : await toPngBlob(blob);
    await navigator.clipboard.write([new ClipboardItem({'image/png': pngBlob})]);
    toast('Foto copiada!');
  }catch(e){
    console.warn('falha ao copiar foto', e);
    toast('Não foi possível copiar esta foto — tente Baixar.', 'err');
  }
}
function toPngBlob(blob){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{
      try{
        const canvas=document.createElement('canvas');
        canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
        canvas.getContext('2d').drawImage(img,0,0);
        canvas.toBlob(b=>{ URL.revokeObjectURL(url); b?resolve(b):reject(new Error('falha ao converter imagem')); }, 'image/png');
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('falha ao carregar imagem')); };
    img.src = url;
  });
}

/* =========================================================================
   CONVERSÃO AUTOMÁTICA DE FOTOS EM FORMATO INCOMPATÍVEL
   (HEIC/HEIF de iPhone, TIFF, BMP e afins) para PNG/JPEG antes de anexar,
   tanto no upload manual quanto na importação de fotos da planilha.
   ========================================================================= */
const COMPATIBLE_PHOTO_MIMES = new Set(['image/png','image/jpeg','image/webp','image/gif']);
const _libLoadCache = {};
function loadScriptOnce(url, checkGlobal){
  if(_libLoadCache[url]) return _libLoadCache[url];
  _libLoadCache[url] = new Promise((resolve,reject)=>{
    if(checkGlobal()) return resolve();
    const s=document.createElement('script');
    s.src=url;
    s.onload=()=>checkGlobal()?resolve():reject(new Error('biblioteca carregada, mas indisponível'));
    s.onerror=()=>reject(new Error('falha ao carregar biblioteca de conversão de imagem'));
    document.head.appendChild(s);
  });
  return _libLoadCache[url];
}
function extOfName(name){ return (String(name||'').split('.').pop()||'').toLowerCase(); }
async function decodeTiffToCanvas(buf){
  await loadScriptOnce('https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js', ()=>typeof UTIF!=='undefined');
  const ifds = UTIF.decode(buf);
  UTIF.decodeImage(buf, ifds[0]);
  const rgba = UTIF.toRGBA8(ifds[0]);
  const canvas=document.createElement('canvas');
  canvas.width=ifds[0].width; canvas.height=ifds[0].height;
  const ctx=canvas.getContext('2d');
  const imgData=ctx.createImageData(canvas.width, canvas.height);
  imgData.data.set(rgba);
  ctx.putImageData(imgData,0,0);
  return canvas;
}
async function decodeHeicToJpegBlob(blob){
  await loadScriptOnce('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js', ()=>typeof heic2any!=='undefined');
  const out = await heic2any({blob, toType:'image/jpeg', quality:0.9});
  return Array.isArray(out) ? out[0] : out;
}
// Recebe um File/Blob de foto em qualquer formato e devolve sempre algo
// compatível (PNG/JPEG) para anexar ao RDO. Se já for compatível, devolve
// o próprio arquivo sem reprocessar. Lança erro só nos poucos casos que
// nenhum método consegue decodificar (ex.: EMF/WMF, arquivo corrompido).
async function ensureCompatiblePhoto(file){
  const mime=(file.type||'').toLowerCase();
  const ext=extOfName(file.name||'');
  if(COMPATIBLE_PHOTO_MIMES.has(mime)) return {blob:file, mime, converted:false};
  // 1ª tentativa: deixa o próprio navegador decodificar (cobre BMP e outros
  // formatos que o Chrome/Firefox/Safari já sabem exibir nativamente).
  try{
    const pngBlob = await toPngBlob(file);
    return {blob:pngBlob, mime:'image/png', converted:true, via:'nativo'};
  }catch(e){ /* segue para os conversores específicos abaixo */ }
  const isHeic = mime.includes('heic') || mime.includes('heif') || ext==='heic' || ext==='heif';
  const isTiff = mime.includes('tiff') || ext==='tif' || ext==='tiff';
  if(isHeic){
    const jpegBlob = await decodeHeicToJpegBlob(file);
    return {blob:jpegBlob, mime:'image/jpeg', converted:true, via:'heic'};
  }
  if(isTiff){
    const buf = await file.arrayBuffer();
    const canvas = await decodeTiffToCanvas(buf);
    const pngBlob = await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('falha ao converter TIFF')),'image/png'));
    return {blob:pngBlob, mime:'image/png', converted:true, via:'tiff'};
  }
  throw new Error('Formato de imagem não suportado ('+(ext||mime||'desconhecido')+').');
}

/* =========================================================================
   ARMAZENAMENTO LOCAL DE FOTOS (IndexedDB)
   Usado quando o painel roda como arquivo HTML autônomo, fora do ambiente
   de artifacts (sem window.claude) — assim o anexo de fotos continua
   funcionando 100% no navegador, sem precisar de servidor.
   ========================================================================= */
const LOCAL_PHOTO_DB='rdo_photos_v1', LOCAL_PHOTO_STORE='photos';
let _localPhotoDbPromise=null;
function openLocalPhotoDb(){
  if(_localPhotoDbPromise) return _localPhotoDbPromise;
  _localPhotoDbPromise = new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB indisponível neste navegador')); return; }
    const req = indexedDB.open(LOCAL_PHOTO_DB, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(LOCAL_PHOTO_STORE, {keyPath:'id'}); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error||new Error('falha ao abrir IndexedDB'));
  });
  return _localPhotoDbPromise;
}
function idbPut(record){
  return openLocalPhotoDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(LOCAL_PHOTO_STORE,'readwrite');
    tx.objectStore(LOCAL_PHOTO_STORE).put(record);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  }));
}
function idbGet(id){
  return openLocalPhotoDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(LOCAL_PHOTO_STORE,'readonly');
    const req=tx.objectStore(LOCAL_PHOTO_STORE).get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  }));
}
function idbDelete(id){
  return openLocalPhotoDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(LOCAL_PHOTO_STORE,'readwrite');
    tx.objectStore(LOCAL_PHOTO_STORE).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  }));
}
function idbGetAll(){
  return openLocalPhotoDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(LOCAL_PHOTO_STORE,'readonly');
    const req=tx.objectStore(LOCAL_PHOTO_STORE).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  }));
}
const _localBlobUrlCache={};
function cacheLocalBlobUrl(id, blob){
  try{
    if(_localBlobUrlCache[id]) URL.revokeObjectURL(_localBlobUrlCache[id]);
    _localBlobUrlCache[id] = URL.createObjectURL(blob);
  }catch(e){}
}
const localAssetsCap = {
  async upload(blob, opts){
    const id = 'local_'+uid();
    const type = (opts&&opts.type) || blob.type || 'application/octet-stream';
    await idbPut({id, blob, type, size:blob.size||0, createdAt:Date.now()});
    cacheLocalBlobUrl(id, blob);
    return {id, url:'#local:'+id, sizeBytes:blob.size||0, contentType:type};
  },
  async delete(id){
    await idbDelete(id);
    if(_localBlobUrlCache[id]){ try{URL.revokeObjectURL(_localBlobUrlCache[id]);}catch(e){} delete _localBlobUrlCache[id]; }
    return {deleted:true};
  },
  async list(){
    const all = await idbGetAll();
    const bytes = all.reduce((s,r)=>s+(r.size||0),0);
    return { assets: all.map(r=>({id:r.id, sizeBytes:r.size, contentType:r.type})), usage:{files:all.length, bytes, maxFiles:5000, maxBytes:500*1024*1024} };
  },
};
// Depois de carregar os RDOs salvos (localStorage), busca no IndexedDB o
// blob de cada foto referenciada e prepara a URL local usada por blobUrl().
async function hydrateLocalPhotoUrls(rdoList){
  const ids=new Set();
  (rdoList||[]).forEach(r=>(r.atividades||[]).forEach(a=>(a.fotos||[]).forEach(p=>{ if(p && p.id) ids.add(p.id); })));
  if(!ids.size) return;
  try{
    await Promise.all(Array.from(ids).map(async id=>{
      if(_localBlobUrlCache[id]) return;
      const rec = await idbGet(id);
      if(rec && rec.blob) cacheLocalBlobUrl(id, rec.blob);
    }));
  }catch(e){ console.warn('falha ao carregar fotos locais salvas', e); }
}

async function boot(){
  document.querySelector('[data-view="painel"]').innerHTML = ic('grid')+'<span class="tab-label">Painel</span>';
  document.querySelector('[data-view="diario"]').innerHTML = ic('list')+'<span class="tab-label">Diário de Obra</span>';
  initTheme();

  if(window.claude && typeof window.claude.use === 'function'){
    try{
      const [db, assets, user, downloads] = await Promise.all([
        window.claude.use('db').catch(()=>null),
        window.claude.use('assets').catch(()=>null),
        window.claude.use('user').catch(()=>null),
        window.claude.use('downloads').catch(()=>null),
      ]);
      dbCap=db; assetsCap=assets; userCap=user; downloadsCap=downloads;
    }catch(e){ /* segue sem capacidades */ }
  }

  if(userCap){
    try{
      const [me, canWrite, canEdit] = await Promise.all([
        userCap.me(), userCap.can('data.write'), userCap.canEdit()
      ]);
      claudeUser = {id: me.id, name: me.name||'', canEdit: !!canEdit, canWrite: canWrite};
    }catch(e){}
  }

  if(dbCap){
    try{
      const q = dbCap.collection('rdos').orderBy('data','desc').limit(300);
      unsub = q.onSnapshot(snap=>{
        rdos = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
        demoMode = rdos.length===0;
        usingLocalFallback=false;
        updateModePill();
        renderCurrentView();
      }, err=>{
        console.warn('db onSnapshot error', err);
        fallbackLocal();
      });
    }catch(e){ fallbackLocal(); }
  } else {
    fallbackLocal();
  }

  updateModePill();
  renderCurrentView();
}
function fallbackLocal(){
  usingLocalFallback=true;
  if(!assetsCap) assetsCap = localAssetsCap;
  let raw=null;
  try{ raw = localStorage.getItem(LS_DATA); }catch(e){ raw=null; }
  if(raw==null && window.__RDO_SEED__ && Array.isArray(window.__RDO_SEED__) && window.__RDO_SEED__.length){
    // Primeira vez que este arquivo é aberto neste navegador (ainda não há nada
    // salvo em localStorage): carrega os RDOs que já vieram pré-preenchidos
    // junto com este pacote. Depois disso, o que estiver em localStorage manda.
    rdos = window.__RDO_SEED__.slice();
    persistLocal();
    setTimeout(()=>toast(rdos.length+' RDO(s) pré-carregado(s) neste painel.'), 300);
  } else {
    try{ rdos = JSON.parse(raw||'[]'); }catch(e){ rdos=[]; }
  }
  rdos.sort((a,b)=> (b.data||'').localeCompare(a.data||''));
  demoMode = rdos.length===0;
  updateModePill();
  renderCurrentView();
  // busca as fotos já salvas no IndexedDB e re-renderiza quando estiverem prontas
  hydrateLocalPhotoUrls(rdos).then(()=>{ if(usingLocalFallback) renderCurrentView(); });
}
function persistLocal(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify(rdos)); }catch(e){}
}

/* ---- gráfico de barras leve, sem dependências, com tooltip ---- */
function drawBarChart(container, items, opts){
  opts=opts||{};
  const w=560, h=170, padL=8, padR=8, padT=18, padB=26;
  const max=Math.max(1, ...items.map(i=>i.value));
  const bw = (w-padL-padR)/items.length;
  const barW = Math.min(34, bw*0.62);

  let bars='';
  items.forEach((it,i)=>{
    const x = padL + i*bw + (bw-barW)/2;
    const bh = Math.max(2, (it.value/max)*(h-padT-padB));
    const y = h-padB-bh;
    bars += `<rect class="bar-rect" tabindex="0" role="img" aria-label="${esc(it.label)}: ${it.value}"
      x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="4"
      fill="${it.color}" data-label="${esc(it.label)}" data-value="${it.value}"></rect>`;
    bars += `<text class="bar-label" x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}">${it.value}</text>`;
    bars += `<text class="axis-label" x="${(x+barW/2).toFixed(1)}" y="${h-8}">${esc(it.label)}</text>`;
  });
  const grid = [0.5].map(f=>`<line class="gridline" x1="${padL}" x2="${w-padR}" y1="${(h-padB-(h-padT-padB)*f).toFixed(1)}" y2="${(h-padB-(h-padT-padB)*f).toFixed(1)}" stroke-dasharray="2 3"/>`).join('');

  container.style.position='relative';
  container.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${grid}<line class="gridline" x1="${padL}" x2="${w-padR}" y1="${h-padB}" y2="${h-padB}"/>${bars}</svg><div class="viz-tooltip"></div>`;

  const tip=container.querySelector('.viz-tooltip');
  container.querySelectorAll('.bar-rect').forEach(rect=>{
    const show=(ev)=>{
      const box=container.getBoundingClientRect();
      const rbox=rect.getBoundingClientRect();
      tip.textContent = rect.dataset.label+': '+rect.dataset.value+(opts.suffix||'');
      tip.style.left = (rbox.left - box.left + rbox.width/2)+'px';
      tip.style.top = (rbox.top - box.top)+'px';
      tip.classList.add('show');
    };
    const hide=()=>tip.classList.remove('show');
    rect.addEventListener('mouseenter', show);
    rect.addEventListener('mousemove', show);
    rect.addEventListener('mouseleave', hide);
    rect.addEventListener('focus', show);
    rect.addEventListener('blur', hide);
  });
}

  root.querySelectorAll('[data-action]').forEach(elm=>{

      if(action==='open-rdo'){ openDetail(id); }

      if(action==='export-rdo'){ ev.stopPropagation(); exportRdo(id); }
      if(action==='ask-delete'){ ev.stopPropagation(); confirmingDeleteId=id; renderCurrentView(); }
      if(action==='cancel-delete'){ ev.stopPropagation(); confirmingDeleteId=null; renderCurrentView(); }
      if(action==='confirm-delete'){ ev.stopPropagation(); doDelete(id); }
    });
  });
}

/* =========================================================================
   EXPORTAR (texto simples via capacidade downloads)
   ========================================================================= */
function buildExportText(r){
  const L=[];
  L.push('RELATÓRIO DIÁRIO DE OBRA (RDO)');
  L.push('='.repeat(40));
  L.push('Nº RDO: '+String(r.numero||'—').padStart(3,'0'));
  L.push('Obra: '+(r.obra||'—'));
  L.push('Contratada: '+(r.contratada||'—'));
  L.push('Cliente: '+(r.cliente||'—')+(r.contrato?'   Contrato: '+r.contrato:''));
  L.push('Data: '+fmtDateLong(r.data));
  L.push('Responsável técnico: '+(r.responsavel||'—'));
  L.push('Status: '+(r.status==='emitido'?'Emitido':'Rascunho'));
  L.push('');
  L.push('CONDIÇÕES CLIMÁTICAS');
  L.push('Manhã: '+(r.clima&&r.clima.manha)+' | Tarde: '+(r.clima&&r.clima.tarde)+' | Noite: '+(r.clima&&r.clima.noite));
  L.push('Horas de chuva com impacto: '+((r.clima&&r.clima.chuvaHoras)||0)+'h');
  L.push('');
  L.push('EFETIVO');
  (r.efetivo||[]).forEach(x=>L.push('- '+x.funcao+': '+x.qtd));
  if(!(r.efetivo||[]).length) L.push('(nenhum registro)');
  L.push('');
  L.push('EQUIPAMENTOS');
  (r.equipamentos||[]).forEach(x=>L.push('- '+x.nome+' (x'+x.qtd+') — '+x.situacao+' — '+x.horas+'h trabalhadas'));
  if(!(r.equipamentos||[]).length) L.push('(nenhum registro)');
  L.push('');
  L.push('ATIVIDADES EXECUTADAS');
  (r.atividades||[]).forEach((a,i)=>{
    L.push((i+1)+'. ['+a.disciplina+'] '+a.descricao+' — Local: '+a.local+' — '+a.percentual+'% — '+a.status);
    if(a.fotos&&a.fotos.length) L.push('   Fotos anexadas: '+a.fotos.length);
  });
  if(!(r.atividades||[]).length) L.push('(nenhuma atividade registrada)');
  L.push('');
  L.push('OCORRÊNCIAS');
  (r.ocorrencias||[]).forEach(o=>L.push('- ['+o.gravidade+'] '+o.descricao));
  if(!(r.ocorrencias||[]).length) L.push('(sem ocorrências)');
  L.push('');
  L.push('OBSERVAÇÕES GERAIS');
  L.push(r.observacoes||'—');
  return L.join('\n');
}
async function exportRdo(id){
  const r=findRdo(id);
  if(!r) return;
  const text=buildExportText(r);
  const filename='RDO-'+String(r.numero||'000').padStart(3,'0')+'-'+(r.data||'')+'.txt';
  if(downloadsCap){
    try{
      await downloadsCap.save({filename, data:text});
      toast('RDO exportado.');
      return;
    }catch(e){
      if(e && e.code==='declined') return;
      // segue para o fallback abaixo
    }
  }
  try{
    const blob=new Blob([text],{type:'text/plain'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ toast('Não foi possível exportar aqui. Copie os dados manualmente.', 'err'); }
}

function computeNextNumero(){
  const nums = activeDataset().map(r=>Number(r.numero)||0);
  return nums.length ? Math.max(...nums)+1 : 1;
}
function blankRdo(){
  const last = activeDataset()[0];
  return {
    numero: computeNextNumero(),
    obra: last ? last.obra : '',
    contratada: last ? (last.contratada||'') : '',
    cliente: last ? last.cliente : '',
    contrato: last ? last.contrato : '',
    data: todayISO(),
    responsavel: claudeUser.name || (last?last.responsavel:'') || '',
    clima: {manha:'Bom', tarde:'Bom', noite:'Bom', chuvaHoras:0, impacto:false},
    efetivo: [], equipamentos: [], atividades: [], ocorrencias: [],
    observacoes: '', status: 'rascunho',
  };
}
function withKeys(rdo){
  const c=JSON.parse(JSON.stringify(rdo));
  (c.efetivo||[]).forEach(x=>x._k=x._k||uid());
  (c.equipamentos||[]).forEach(x=>x._k=x._k||uid());
  (c.atividades||[]).forEach(x=>{ x._k=x._k||uid(); (x.fotos||[]).forEach(f=>f._k=f._k||uid()); });
  (c.ocorrencias||[]).forEach(x=>x._k=x._k||uid());
  return c;
}

function openForm(id){
  editingId=id;
  const base = id ? findRdo(id) : blankRdo();
  formState = withKeys(base);
  importLog=null;
  setView('form');
  renderFormView();
}

/* =========================================================================
   IMPORTAÇÃO DE PLANILHA EXCEL (SheetJS + JSZip)
   Heurística: procura por rótulos conhecidos (Obra, Cliente, Data...) e por
   tabelas com linha de cabeçalho reconhecível (Efetivo, Equipamentos,
   Atividades, Ocorrências). Fotos embutidas no .xlsx são copiadas para o
   Registro Fotográfico. É um "melhor esforço" — sempre revise após importar.
   ========================================================================= */
function matchEnum(value, list){
  if(value==null||value==='') return null;
  const n=normText(value);
  return list.find(x=>normText(x)===n) || null;
}
function optionsWithExtra(list, current){
  const extra = (current && !list.includes(current)) ? [current] : [];
  return [...list, ...extra].map(o=>`<option ${current===o?'selected':''}>${esc(o)}</option>`).join('');
}
function normText(s){
  return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/\p{M}/gu,'')
    .replace(/[°ºª.,:;()\[\]]/g,' ').replace(/\s+/g,' ').trim();
}
function sheetToGrid(ws){
  if(!ws || !ws['!ref']) return [];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const grid=[];
  for(let R=range.s.r; R<=range.e.r; R++){
    const row=[];
    for(let C=range.s.c; C<=range.e.c; C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      const cell=ws[addr];
      let val='';
      if(cell){
        if(cell.t==='d') val = (cell.v instanceof Date)? cell.v : (cell.w!=null?cell.w:cell.v);
        else val = (cell.w!=null && cell.w!=='') ? cell.w : cell.v;
      }
      row.push(val===undefined?'':val);
    }
    grid.push(row);
  }
  return grid;
}
function cellText(grid,r,c){ return (grid[r] && grid[r][c]!=null) ? grid[r][c] : ''; }
function tight(s){ return normText(s).replace(/\s+/g,''); }
const SECTION_TITLE_HINTS = ['atividadesemexecucao','atividades','equipamentos','efetivo','identificacao','assinatura','relatoriodiariodeobra'];
function looksLikeSectionTitle(v){
  const tt=tight(v);
  if(!tt || tt.length<4) return false;
  return SECTION_TITLE_HINTS.some(k=>tt.includes(k));
}
function rowHasKeyword(grid,r,keywords){
  if(!grid[r]) return -1;
  for(let c=0;c<grid[r].length;c++){
    const t=normText(cellText(grid,r,c));
    if(t && keywords.some(k=>t.includes(k))) return c;
  }
  return -1;
}
function findSectionTitleRow(grid, keyword){
  for(let r=0;r<grid.length;r++){
    for(let c=0;c<(grid[r]||[]).length;c++){
      if(tight(cellText(grid,r,c)).includes(keyword)) return r;
    }
  }
  return -1;
}
function findScalar(grid, keywords, opts){
  opts=opts||{};
  for(let r=0;r<grid.length;r++){
    for(let c=0;c<grid[r].length;c++){
      const raw=cellText(grid,r,c);
      const t=normText(raw);
      if(!t || t.length>80) continue;
      if(opts.exclude && opts.exclude.some(x=>t.includes(x))) continue;
      if(keywords.some(k=>t.includes(k))){
        if(opts.sameCellRegex){
          const m=String(raw).match(opts.sameCellRegex);
          if(m) return m[1];
        }
        // "Rótulo: valor" na mesma célula
        const rawStr=String(raw);
        const colonIdx=rawStr.indexOf(':');
        if(colonIdx>=0){
          const after=rawStr.slice(colonIdx+1).trim();
          if(after && !looksLikeSectionTitle(after)) return after;
        }
        // valor em células à direita, na mesma linha
        for(let cc=c+1; cc<Math.min(grid[r].length,c+6); cc++){
          const v=cellText(grid,r,cc);
          if(v!=='' && v!=null && !looksLikeSectionTitle(v)) return v;
        }
        // valor em até 3 linhas abaixo, mesma coluna (rótulo isolado + valor embaixo)
        for(let rr=r+1; rr<Math.min(grid.length,r+4); rr++){
          const v=cellText(grid,rr,c);
          if(v!=='' && v!=null && !looksLikeSectionTitle(v)) return v;
        }
      }
    }
  }
  return null;
}
function findTableHeader(grid, roleKeywords){
  const roles=Object.keys(roleKeywords);
  const minMatches = Math.min(2, roles.length);
  for(let r=0;r<grid.length;r++){
    const colMap={};
    for(let c=0;c<(grid[r]||[]).length;c++){
      const t=normText(cellText(grid,r,c));
      if(!t) continue;
      for(const role of roles){
        if(colMap[role]==null && roleKeywords[role].some(k=>t===k || t.includes(k))) colMap[role]=c;
      }
    }
    if(Object.keys(colMap).length>=minMatches) return {headerRow:r, colMap};
  }
  return null;
}
function extractTableRows(grid, headerRow, colMap, maxRows){
  const rows=[];
  for(let r=headerRow+1; r<grid.length && rows.length<(maxRows||80); r++){
    const vals={}; let anyFilled=false;
    for(const role in colMap){
      const v=cellText(grid,r,colMap[role]);
      vals[role]=v;
      if(v!=='' && v!=null) anyFilled=true;
    }
    if(!anyFilled) break;
    rows.push(vals);
  }
  return rows;
}
// Matriz de clima no formato "Período" (linha) x "Manhã/Tarde/Noite" (colunas),
// com uma marca (x) na célula do período escolhido para cada turno.
function parseClimaMatrix(grid){
  for(let r=0;r<grid.length;r++){
    const cM=rowHasKeyword(grid,r,['manha']);
    const cT=rowHasKeyword(grid,r,['tarde']);
    const cN=rowHasKeyword(grid,r,['noite']);
    if(cM>=0 && cT>=0){
      const cols={manha:cM, tarde:cT, noite:cN>=0?cN:null};
      const result={};
      for(let rr=r+1; rr<Math.min(grid.length,r+8); rr++){
        const label=normText(cellText(grid,rr,cM-1)||cellText(grid,rr,0));
        if(!label) continue;
        let periodo=null;
        if(label.includes('bom')) periodo='Bom';
        else if(label.includes('chuv')) periodo='Chuvoso';
        else if(label.includes('ruim') || label.includes('nublad')) periodo='Nublado';
        if(!periodo) continue;
        for(const turno of ['manha','tarde','noite']){
          const cc=cols[turno];
          if(cc==null) continue;
          const v=String(cellText(grid,rr,cc)||'').trim().toLowerCase();
          if(v && (v==='x' || v==='1' || v==='sim')) result[turno]=periodo;
        }
      }
      if(Object.keys(result).length) return result;
    }
  }
  return null;
}
// Lê um par de colunas SIM/NÃO numa linha e devolve qual foi marcada com 'x'.
// Lê o par de rótulos SIM/NÃO de uma linha (colunas cSim/cNao) e olha, 1 a 3
// colunas depois de cada rótulo, por uma marcação (x / 1) — é ali, e não no
// próprio rótulo, que o modelo da DG registra a resposta escolhida.
function readSimNao(grid, r, cSim, cNao){
  const isMark=(v)=>{ const t=String(v||'').trim().toLowerCase(); return t==='x' || t==='1'; };
  for(let off=1; off<=3; off++){ if(isMark(cellText(grid,r,cSim+off))) return 'SIM'; }
  for(let off=1; off<=3; off++){ if(isMark(cellText(grid,r,cNao+off))) return 'NAO'; }
  return null;
}
// Checklist de segurança (DDS, prejuízo material, violação de segurança, ociosidade)
// com colunas SIM/NÃO — converte respostas-problema em ocorrências.
function extractSafetyChecklistOcorrencias(grid){
  const checks=[
    {keywords:['dds','dialogo diario'], label:'DDS não realizado', positiveIsProblem:false},
    {keywords:['prejuizo material'], label:'Prejuízo material registrado', positiveIsProblem:true},
    {keywords:['violac'], label:'Violação de segurança registrada', positiveIsProblem:true},
    {keywords:['ociosidade'], label:'Ociosidade por acidente registrada', positiveIsProblem:true},
  ];
  const out=[];
  for(let r=0;r<grid.length;r++){
    for(const chk of checks){
      const c=rowHasKeyword(grid,r,chk.keywords);
      if(c<0) continue;
      const simCol=rowHasKeyword(grid,r,['sim']);
      const naoCol=rowHasKeyword(grid,r,['nao']);
      if(simCol<0 || naoCol<0) continue;
      const answer=readSimNao(grid, r, simCol, naoCol);
      if(!answer) continue;
      const isProblem = chk.positiveIsProblem ? answer==='SIM' : answer==='NAO';
      if(isProblem) out.push({descricao: chk.label, gravidade: 'Média'});
    }
  }
  return out;
}
// Localiza, dentro de [sectionStart,sectionEnd), os títulos dos blocos
// (ex.: "MÃO DE OBRA DIRETA"/"INDIRETA", "CONTRATADA"/"TERCEIROS") e devolve
// {key,titleRow,titleCol} ordenados pela coluna — a ordem das colunas define
// a "região" de cada bloco na planilha.
function findBlockTitles(grid, sectionStart, sectionEnd, blockDefs){
  const found=[];
  for(const bd of blockDefs){
    let titleRow=-1, titleCol=-1;
    for(let r=sectionStart;r<sectionEnd && titleRow<0;r++){
      for(let c=0;c<(grid[r]||[]).length;c++){
        const t=tight(cellText(grid,r,c));
        if(t && bd.keywords.some(k=>t.includes(k))){ titleRow=r; titleCol=c; break; }
      }
    }
    if(titleRow>=0) found.push({key:bd.key, titleRow, titleCol});
  }
  found.sort((a,b)=>a.titleCol-b.titleCol);
  return found;
}
// Procura, em toda a seção e dentro de uma faixa de colunas [colStart,colEnd),
// a primeira célula cujo texto normalizado satisfaz isHeaderText — usada para
// achar a coluna "Real"/"Total Real" de um bloco, que pode estar em qualquer
// linha da seção (acima, ao lado ou abaixo do título do bloco, conforme o
// modelo da planilha).
function findQtyColumnInRegion(grid, sectionStart, sectionEnd, colStart, colEnd, isHeaderText){
  for(let r=sectionStart;r<sectionEnd;r++){
    for(let c=colStart;c<colEnd && c<(grid[r]||[]).length;c++){
      const t=normText(cellText(grid,r,c));
      if(t && isHeaderText(t)) return c;
    }
  }
  return -1;
}
// Blocos de mão de obra sem cabeçalho literal de coluna "Função": o título do
// bloco (ex.: "MÃO DE OBRA DIRETA") ancora a coluna do nome; a quantidade vem
// da coluna "Total Real" mais próxima, buscada em toda a seção.
function extractMaoDeObraBlocks(grid, sectionStart, sectionEnd){
  const titles = findBlockTitles(grid, sectionStart, sectionEnd, [
    {keywords:['maodeobraindireta'], key:'indireta'},
    {keywords:['maodeobradireta'], key:'direta'},
  ]);
  const out=[];
  for(let i=0;i<titles.length;i++){
    const {titleRow, titleCol}=titles[i];
    const colEnd = (i+1<titles.length) ? titles[i+1].titleCol : Infinity;
    const qtdCol = findQtyColumnInRegion(grid, sectionStart, sectionEnd, titleCol, colEnd, t=>t==='real' || t.includes('total real'));
    for(let r=titleRow+1;r<sectionEnd;r++){
      const nome=String(cellText(grid,r,titleCol)||'').trim();
      if(!nome) continue;
      if(looksLikeSectionTitle(nome)) break;
      const nt=normText(nome);
      if(nt.includes('total') || nt.startsWith('funcao')) continue;
      const qtd = qtdCol>=0 ? toNumber(cellText(grid,r,qtdCol)) : 0;
      if(qtd<=0) continue;
      out.push({funcao:nome, qtd});
    }
  }
  return out;
}
// Mesma lógica dos blocos de mão de obra, mas para equipamentos (blocos
// "CONTRATADA" / "TERCEIROS"), quantidade pela coluna "Real".
function extractEquipamentoBlocks(grid, sectionStart, sectionEnd){
  const titles = findBlockTitles(grid, sectionStart, sectionEnd, [
    {keywords:['contratada'], key:'contratada'},
    {keywords:['terceiros'], key:'terceiros'},
  ]);
  const out=[];
  for(let i=0;i<titles.length;i++){
    const {titleRow, titleCol}=titles[i];
    const colEnd = (i+1<titles.length) ? titles[i+1].titleCol : Infinity;
    const qtdCol = findQtyColumnInRegion(grid, sectionStart, sectionEnd, titleCol, colEnd, t=>t==='real' || t.includes('qtd real'));
    for(let r=titleRow+1;r<sectionEnd;r++){
      const nome=String(cellText(grid,r,titleCol)||'').trim();
      if(!nome) continue;
      if(looksLikeSectionTitle(nome)) break;
      const nt=normText(nome);
      if(nt.includes('total')) continue;
      const qtd = qtdCol>=0 ? toNumber(cellText(grid,r,qtdCol)) : 0;
      if(qtd<=0) continue;
      out.push({nome, qtd, situacao:'Operando', horas:0});
    }
  }
  return out;
}
// Tenta reconhecer, num parágrafo de atividade em texto livre, um percentual
// e um status implícitos (ex.: "...100% CONCLUÍDAS", "...serviço paralisado").
function inferActivityMeta(text){
  const t=normText(text);
  let percentual=0, status='Em andamento';
  const pct=text.match(/(\d{1,3})\s*%/);
  if(pct) percentual=Math.min(100, parseInt(pct[1],10));
  if(t.includes('concluid')){ status='Concluída'; if(!percentual) percentual=100; }
  else if(t.includes('paralisad')){ status='Paralisada'; }
  else if(t.includes('nao iniciad')){ status='Planejada'; percentual=0; }
  return {percentual, status};
}
// Quando não há tabela estruturada de atividades — apenas parágrafos de texto
// livre sob o título "ATIVIDADES EM EXECUÇÃO" — cada célula não vazia depois
// do título vira um registro de atividade (rótulos de campo como
// "OBSERVAÇÕES :" são descartados, não são atividades).
function extractFreeTextActivities(grid, titleRow){
  const out=[];
  for(let r=titleRow+1;r<Math.min(grid.length,titleRow+12);r++){
    for(let c=0;c<(grid[r]||[]).length;c++){
      const v=cellText(grid,r,c);
      const s=String(v||'').trim();
      if(!s || s.length<8) continue;
      if(looksLikeSectionTitle(s)) continue;
      if(/^\d+([.,]\d+)?%?$/.test(s)) continue;
      if(/:\s*$/.test(s) && s.length<50) continue;
      const meta=inferActivityMeta(s);
      out.push({descricao:s, local:'', disciplina:'Outras', percentual:meta.percentual, status:meta.status, fotos:[], _row:r, _col:c});
    }
  }
  return out;
}
// Resolve um Target relativo de relacionamento OOXML (ex.: "../media/x.png")
// a partir do diretório do arquivo que o referencia.
function resolveRelPath(baseDir, target){
  if(!target) return null;
  if(target.startsWith('/')) return target.replace(/^\/+/,'');
  const parts=(baseDir+'/'+target).split('/');
  const out=[];
  for(const p of parts){
    if(p==='..') out.pop();
    else if(p==='' || p==='.') continue;
    else out.push(p);
  }
  return out.join('/');
}
// Lê xl/workbook.xml + as cadeias de relacionamento (workbook → planilha →
// desenho → imagem) para descobrir ONDE cada imagem foi ancorada na
// planilha (aba, linha e coluna) — é essa posição que permite vincular cada
// foto à atividade ao lado da qual ela foi colada no Excel, em vez de jogar
// tudo genericamente no registro fotográfico geral.
async function extractImageAnchors(zip){
  const result={};
  if(typeof DOMParser==='undefined') return result;
  const parser=new DOMParser();
  const readXml=async(path)=>{
    const f=zip.file(path);
    if(!f) return null;
    try{ return parser.parseFromString(await f.async('text'), 'application/xml'); }
    catch(e){ return null; }
  };
  const relMap=(doc)=>{
    const m={};
    if(!doc) return m;
    Array.from(doc.getElementsByTagName('Relationship')).forEach(el=>{
      m[el.getAttribute('Id')]={target:el.getAttribute('Target'), type:el.getAttribute('Type')||''};
    });
    return m;
  };
  const wbDoc = await readXml('xl/workbook.xml');
  if(!wbDoc) return result;
  const wbRelsDoc = await readXml('xl/_rels/workbook.xml.rels');
  const wbRels = relMap(wbRelsDoc);
  const sheetEls = Array.from(wbDoc.getElementsByTagName('sheet'));
  for(const el of sheetEls){
    const sheetName = el.getAttribute('name');
    const rId = el.getAttribute('r:id') || el.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const rel = rId && wbRels[rId];
    if(!rel) continue;
    const sheetPath = resolveRelPath('xl', rel.target);
    if(!sheetPath) continue;
    const sheetDir = sheetPath.substring(0, sheetPath.lastIndexOf('/'));
    const sheetFile = sheetPath.substring(sheetPath.lastIndexOf('/')+1);
    const sheetRelsDoc = await readXml(sheetDir+'/_rels/'+sheetFile+'.rels');
    const sheetRels = relMap(sheetRelsDoc);
    const drawingRel = Object.values(sheetRels).find(r=>/drawing/i.test(r.type));
    if(!drawingRel) continue;
    const drawingPath = resolveRelPath(sheetDir, drawingRel.target);
    const drawingDoc = await readXml(drawingPath);
    if(!drawingDoc) continue;
    const drawingDir = drawingPath.substring(0, drawingPath.lastIndexOf('/'));
    const drawingFile = drawingPath.substring(drawingPath.lastIndexOf('/')+1);
    const drawingRelsDoc = await readXml(drawingDir+'/_rels/'+drawingFile+'.rels');
    const drawingRels = relMap(drawingRelsDoc);
    const anchorNodes=[
      ...Array.from(drawingDoc.getElementsByTagName('xdr:twoCellAnchor')),
      ...Array.from(drawingDoc.getElementsByTagName('xdr:oneCellAnchor')),
    ];
    for(const anchor of anchorNodes){
      const fromEl = anchor.getElementsByTagName('xdr:from')[0];
      if(!fromEl) continue;
      const colEl = fromEl.getElementsByTagName('xdr:col')[0];
      const rowEl = fromEl.getElementsByTagName('xdr:row')[0];
      if(!colEl || !rowEl) continue;
      const col = parseInt(colEl.textContent, 10);
      const row = parseInt(rowEl.textContent, 10);
      const blipEl = anchor.getElementsByTagName('a:blip')[0];
      if(!blipEl) continue;
      const embedId = blipEl.getAttribute('r:embed') || blipEl.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed');
      const imgRel = embedId && drawingRels[embedId];
      if(!imgRel) continue;
      const mediaPath = resolveRelPath(drawingDir, imgRel.target);
      if(!mediaPath || isNaN(row) || isNaN(col)) continue;
      (result[mediaPath]=result[mediaPath]||[]).push({sheetName, row, col});
    }
  }
  return result;
}
// Decide a qual atividade (se alguma) uma imagem ancorada em (sheetName,row,col)
// pertence: só vincula quando a imagem está a poucas linhas de distância da
// atividade (evita pegar logos/carimbos de assinatura distantes) e, entre
// atividades da mesma linha (colunas lado a lado), escolhe pela faixa de
// colunas mais próxima da posição da imagem.
function matchImageToActivity(atividades, sheetName, row, col){
  const MAX_ROW_DIST=4;
  const candidates=(atividades||[]).filter(a=>a._sheet===sheetName && a._row!=null && Math.abs(a._row-row)<=MAX_ROW_DIST);
  if(!candidates.length) return null;
  let best=null, bestScore=Infinity;
  for(const a of candidates){
    const rowDist=Math.abs(a._row-row);
    const sameRow=candidates.filter(x=>x._row===a._row).sort((x,y)=>x._col-y._col);
    const idx=sameRow.indexOf(a);
    const colStart=a._col;
    const colEnd=(idx+1<sameRow.length) ? sameRow[idx+1]._col : Infinity;
    const colOk = col>=colStart && col<colEnd;
    const score = rowDist*10 + (colOk?0:6);
    if(score<bestScore){ bestScore=score; best=a; }
  }
  return best;
}
function toNumber(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return v;
  const n=parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,''));
  return isNaN(n)?0:n;
}
function toPercent(v){
  if(v==null||v==='') return 0;
  if(typeof v==='number') return v<=1? Math.round(v*100) : Math.round(v);
  const s=String(v);
  const n=parseFloat(s.replace(',','.').replace(/[^\d.]/g,''));
  if(isNaN(n)) return 0;
  return s.includes('%') ? Math.round(n) : (n<=1? Math.round(n*100): Math.round(n));
}
function parseDateFlexible(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let d=m[1], mo=m[2], y=m[3]; if(y.length===2) y='20'+y; return y+'-'+mo.padStart(2,'0')+'-'+d.padStart(2,'0'); }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[0].slice(0,10);
  return null;
}
function parseGridToRdo(grid, sheetName){
  const out={}; const lines=[]; const warnings=[];

  const numero = findScalar(grid, ['n rdo','rdo n','numero do rdo','numero rdo','relatorio n'], {sameCellRegex:/(\d{1,5})\D*$/});
  if(numero!=null){ const n=toNumber(numero); if(n>0){ out.numero=n; lines.push('Nº do RDO: '+n); } }

  const dataVal = findScalar(grid, ['data'], {exclude:['data de emissao','validade']});
  const dataIso = parseDateFlexible(dataVal);
  if(dataIso){ out.data=dataIso; lines.push('Data: '+dataIso); }

  const contratada = findScalar(grid, ['contratada'], {exclude:['mao de obra contratada']});
  if(contratada){ out.contratada=String(contratada); lines.push('Contratada: '+contratada); }

  const obra = findScalar(grid, ['obra','projeto'], {exclude:['mao de obra','relatorio diario de obra','diario de obra','relatorio diario']});
  if(obra){ out.obra=String(obra); lines.push('Obra: '+obra); }

  const cliente = findScalar(grid, ['cliente','contratante']);
  if(cliente){ out.cliente=String(cliente); lines.push('Cliente: '+cliente); }

  const contrato = findScalar(grid, ['contrato']);
  if(contrato){ out.contrato=String(contrato); lines.push('Contrato: '+contrato); }

  const responsavel = findScalar(grid, ['responsavel tecnico','responsavel','engenheiro responsavel']);
  if(responsavel){ out.responsavel=String(responsavel); lines.push('Responsável: '+responsavel); }

  const chuva = findScalar(grid, ['hora de chuva','horas de chuva','chuva perdida']);
  if(chuva!=null){ out.clima=out.clima||{}; out.clima.chuvaHoras=toNumber(chuva); }

  // Clima: tenta primeiro o padrão em matriz (Período x turno com marcação 'x'),
  // depois o padrão simples (cabeçalho Manhã/Tarde/Noite + valor na linha de baixo).
  const climaMatrix = parseClimaMatrix(grid);
  if(climaMatrix){
    out.clima=Object.assign({}, out.clima, climaMatrix);
    lines.push('Clima identificado (manhã / tarde / noite)');
  } else {
    for(let r=0;r<grid.length-1;r++){
      const idxM=rowHasKeyword(grid,r,['manha']);
      const idxT=rowHasKeyword(grid,r,['tarde']);
      const idxN=rowHasKeyword(grid,r,['noite']);
      if(idxM>=0 && idxT>=0 && idxN>=0){
        out.clima=out.clima||{};
        const vm=cellText(grid,r+1,idxM), vt=cellText(grid,r+1,idxT), vn=cellText(grid,r+1,idxN);
        if(vm) out.clima.manha=String(vm);
        if(vt) out.clima.tarde=String(vt);
        if(vn) out.clima.noite=String(vn);
        lines.push('Clima identificado (manhã / tarde / noite)');
        break;
      }
    }
  }

  const obs = findScalar(grid, ['observacoes gerais','observacao geral','obs gerais','observacoes']);
  if(obs){ out.observacoes=String(obs); lines.push('Observações gerais importadas'); }

  // Localiza os títulos das grandes seções (letter-spaced no template padrão
  // DG) para delimitar onde cada bloco de dados começa e termina.
  const rowEfetivoTitle = findSectionTitleRow(grid, 'efetivo');
  const rowEquipTitle = findSectionTitleRow(grid, 'equipamentos');
  const rowAtivTitle = findSectionTitleRow(grid, 'atividadesemexecucao') >=0
    ? findSectionTitleRow(grid, 'atividadesemexecucao')
    : findSectionTitleRow(grid, 'atividades');
  const sectionBoundaries=[rowEfetivoTitle, rowEquipTitle, rowAtivTitle].filter(x=>x>=0).sort((a,b)=>a-b);
  function nextBoundaryAfter(r){
    const nxt=sectionBoundaries.find(b=>b>r);
    return nxt!=null? nxt : grid.length;
  }

  // Efetivo: tenta o padrão de blocos "MÃO DE OBRA INDIRETA/DIRETA" (template DG);
  // se não encontrar nada, cai para a extração genérica por cabeçalho de tabela.
  let efetivoRows=[];
  if(rowEfetivoTitle>=0){
    efetivoRows = extractMaoDeObraBlocks(grid, rowEfetivoTitle, nextBoundaryAfter(rowEfetivoTitle));
  }
  if(!efetivoRows.length){
    const efetivoHeader = findTableHeader(grid, {funcao:['funcao','cargo'], qtd:['qtd','quant','qde']});
    if(efetivoHeader){
      efetivoRows = extractTableRows(grid, efetivoHeader.headerRow, efetivoHeader.colMap)
        .filter(r=>r.funcao).map(r=>({funcao:String(r.funcao), qtd:toNumber(r.qtd)||1}));
    }
  }
  if(efetivoRows.length){ out.efetivo=efetivoRows; lines.push('Efetivo: '+out.efetivo.length+' função(ões) importada(s)'); }

  // Equipamentos: idem, blocos "CONTRATADA/TERCEIROS" primeiro.
  let equipRows=[];
  if(rowEquipTitle>=0){
    equipRows = extractEquipamentoBlocks(grid, rowEquipTitle, nextBoundaryAfter(rowEquipTitle));
  }
  if(!equipRows.length){
    const equipHeader = findTableHeader(grid, {nome:['equipamento','maquina'], qtd:['qtd','quant']});
    if(equipHeader){
      equipRows = extractTableRows(grid, equipHeader.headerRow, equipHeader.colMap)
        .filter(r=>r.nome).map(r=>({nome:String(r.nome), qtd:toNumber(r.qtd)||1, situacao:'Operando', horas:0}));
    }
  }
  if(equipRows.length){ out.equipamentos=equipRows; lines.push('Equipamentos: '+out.equipamentos.length+' item(ns) importado(s)'); }

  // Atividades: tabela estruturada primeiro; se a planilha só traz parágrafos
  // de texto livre (padrão do template DG), usa a extração por texto livre.
  const actHeader = findTableHeader(grid, {descricao:['atividade','descricao','servico'], local:['local','area'], percentual:['%','avanco','percentual'], status:['status','situacao']});
  let atividadesRows=[];
  if(actHeader){
    const rows=extractTableRows(grid, actHeader.headerRow, actHeader.colMap);
    rows.forEach((r,idx)=>{
      if(!r.descricao) return;
      atividadesRows.push({
        descricao:String(r.descricao), local: r.local?String(r.local):'', disciplina:'Outras',
        percentual: r.percentual!=null? toPercent(r.percentual):0,
        status: r.status? String(r.status): 'Planejada', fotos:[],
        _sheet: sheetName, _row: actHeader.headerRow+1+idx, _col: actHeader.colMap.descricao,
      });
    });
  }
  if(!atividadesRows.length && rowAtivTitle>=0){
    atividadesRows = extractFreeTextActivities(grid, rowAtivTitle).map(a=>Object.assign({_sheet:sheetName}, a));
  }
  if(atividadesRows.length){
    out.atividades = atividadesRows;
    lines.push('Atividades: '+out.atividades.length+' registro(s) importado(s)');
  } else {
    warnings.push('Tabela de atividades não identificada automaticamente nesta planilha — confira manualmente.');
  }

  const occHeader = findTableHeader(grid, {descricao:['ocorrencia','nao conformidade'], gravidade:['gravidade','severidade']});
  let ocorrenciasRows=[];
  if(occHeader){
    const rows=extractTableRows(grid, occHeader.headerRow, occHeader.colMap).filter(r=>r.descricao);
    if(rows.length){ ocorrenciasRows = rows.map(r=>({descricao:String(r.descricao), gravidade: matchEnum(r.gravidade,SEVERIDADES)||'Baixa'})); }
  }
  // Checklist de segurança (DDS / prejuízo material / violação / ociosidade),
  // quando presente, também pode gerar ocorrências automaticamente.
  const safetyOcc = extractSafetyChecklistOcorrencias(grid);
  if(safetyOcc.length) ocorrenciasRows = ocorrenciasRows.concat(safetyOcc);
  if(ocorrenciasRows.length){ out.ocorrencias=ocorrenciasRows; lines.push('Ocorrências: '+out.ocorrencias.length+' registro(s) importado(s)'); }

  return {out, lines, warnings};
}
function mergeParsed(base, add){
  for(const k in add.out){
    if(Array.isArray(add.out[k])) base.out[k]=(base.out[k]||[]).concat(add.out[k]);
    else if(k==='clima') base.out.clima=Object.assign({}, base.out.clima, add.out.clima);
    else if(base.out[k]==null || base.out[k]==='') base.out[k]=add.out[k];
  }
  base.lines=base.lines.concat(add.lines);
  base.warnings=base.warnings.concat(add.warnings);
}
async function handleExcelImport(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  if(typeof XLSX==='undefined'){
    importLog={error:'Não foi possível carregar o leitor de planilhas agora (verifique sua conexão) — tente novamente em alguns segundos.'};
    renderFormView(); return;
  }
  toast('Lendo planilha...');
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf.slice(0), {type:'array', cellDates:true});
    const combined = {out:{}, lines:[], warnings:[]};
    wb.SheetNames.forEach(name=>{
      const grid = sheetToGrid(wb.Sheets[name]);
      if(grid.length) mergeParsed(combined, parseGridToRdo(grid, name));
    });

    const o=combined.out;
    ['numero','data','obra','contratada','cliente','contrato','responsavel','observacoes'].forEach(k=>{
      if(o[k]!=null && o[k]!=='') formState[k]=o[k];
    });
    if(o.clima) formState.clima = Object.assign({}, formState.clima, o.clima);
    if(o.efetivo && o.efetivo.length) formState.efetivo = o.efetivo.map(x=>Object.assign({_k:uid()},x));
    if(o.equipamentos && o.equipamentos.length) formState.equipamentos = o.equipamentos.map(x=>Object.assign({_k:uid()},x));
    // mantém _row/_col/_sheet (posição na planilha) temporariamente — usados
    // logo abaixo para vincular automaticamente cada foto à atividade certa.
    if(o.atividades && o.atividades.length) formState.atividades = o.atividades.map(x=>Object.assign({fotos:[]},x,{_k:uid()}));
    if(o.ocorrencias && o.ocorrencias.length) formState.ocorrencias = o.ocorrencias.map(x=>Object.assign({_k:uid()},x));

    let lines=combined.lines.slice();
    let warnings=combined.warnings.slice();
    let photoLinkedCount=0, photoSkippedCount=0;

    if(typeof JSZip!=='undefined' && /\.xlsx$/i.test(file.name)){
      try{
        const zip = await JSZip.loadAsync(buf.slice(0));
        const mediaFiles = Object.keys(zip.files).filter(n=>/^xl\/media\//i.test(n) && !zip.files[n].dir).sort();
        if(mediaFiles.length){
          if(!assetsCap){
            warnings.push(mediaFiles.length+' foto(s) encontrada(s) na planilha, mas anexar fotos requer permissão de edição'+(usingLocalFallback?' e não está disponível no modo local deste navegador':' neste painel')+'.');
          } else {
            let anchors={};
            try{ anchors = await extractImageAnchors(zip); }
            catch(e){ console.warn('falha ao ler posição das imagens', e); }
            const hasAnchorData = Object.keys(anchors).length>0;
            let rr=0, photoConvertedCount=0;
            for(const name of mediaFiles){
              const ext=(name.split('.').pop()||'').toLowerCase();
              const knownMime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp'}[ext];
              // decide o destino ANTES de subir a imagem: se a planilha informa a
              // posição de cada figura, só sobem (e só ficam vinculadas) as que
              // realmente estão coladas ao lado de uma atividade — descarta logos
              // de cabeçalho/assinatura. Sem essa informação de posição, distribui
              // as fotos entre as atividades existentes em vez de perdê-las.
              let activity=null;
              if(hasAnchorData){
                for(const spot of (anchors[name]||[])){
                  activity = matchImageToActivity(formState.atividades, spot.sheetName, spot.row, spot.col);
                  if(activity) break;
                }
              } else if((formState.atividades||[]).length){
                activity = formState.atividades[rr % formState.atividades.length];
                rr++;
              }
              if(!activity){ photoSkippedCount++; continue; }
              try{
                const bytes = await zip.files[name].async('uint8array');
                let blob, mime;
                if(knownMime){
                  blob = new Blob([bytes], {type:knownMime});
                  mime = knownMime;
                } else {
                  // Formato não reconhecido direto (BMP, TIFF, HEIC/HEIF de iPhone,
                  // etc.) — converte para PNG/JPEG antes de desistir da foto.
                  const guessMime={bmp:'image/bmp',tif:'image/tiff',tiff:'image/tiff',heic:'image/heic',heif:'image/heif'}[ext] || 'application/octet-stream';
                  const rawFile = new File([bytes], name.split('/').pop(), {type:guessMime});
                  const fixed = await ensureCompatiblePhoto(rawFile);
                  blob = fixed.blob; mime = fixed.mime;
                  photoConvertedCount++;
                }
                const res = await assetsCap.upload(blob, {type:mime});
                activity.fotos = activity.fotos||[];
                activity.fotos.push({id:res.id, legenda:'', _k:uid()});
                photoLinkedCount++;
              }catch(e){
                console.warn('falha upload/conversão foto planilha', e);
                warnings.push('Formato de imagem ".'+ext+'" da planilha ('+name.split('/').pop()+') não pôde ser convertido para anexar automaticamente.');
              }
            }
            if(photoConvertedCount) lines.push(photoConvertedCount+' foto(s) da planilha convertida(s) automaticamente para um formato compatível');
          }
        }
      }catch(e){
        console.warn('falha ao ler imagens da planilha', e);
        warnings.push('Não foi possível extrair as fotos da planilha (o arquivo pode estar corrompido ou em formato não suportado).');
      }
    } else if(/\.xls$/i.test(file.name)){
      warnings.push('Arquivos .xls (formato antigo) não permitem extrair fotos automaticamente — anexe-as manualmente na atividade correspondente, se houver.');
    }
    // remove os campos temporários de posição — já cumpriram o papel de guiar o vínculo das fotos
    (formState.atividades||[]).forEach(a=>{ delete a._row; delete a._col; delete a._sheet; });
    if(photoLinkedCount) lines.push(photoLinkedCount+' foto(s) vinculada(s) automaticamente à atividade correspondente');
    if(photoSkippedCount) warnings.push(photoSkippedCount+' foto(s) da planilha (provavelmente logos/carimbos) não pareciam pertencer a uma atividade e foram ignoradas.');

    importLog = lines.length ? {lines, warnings} : {error:'Não identifiquei campos conhecidos nesta planilha. Preencha manualmente, ou me envie um exemplo do modelo (anexado no chat) para eu ajustar a importação a ele.'};
  }catch(e){
    console.warn('erro import excel', e);
    importLog={error:'Não foi possível ler este arquivo. Verifique se é um Excel (.xlsx ou .xls) válido.'};
  }
  renderFormView();
}

function canWriteShared(){
  // otimista: se não sabemos (null) ou sim, deixamos escrever; se explicitamente false, bloqueia.
  return claudeUser.canWrite !== false;
