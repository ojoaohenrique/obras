    <div class="desc-photo-row">
      <div class="field"><label>Descrição da atividade</label>
        <textarea oninput="updateArrayField('atividades','${a._k}','descricao',this.value)">${esc(a.descricao)}</textarea>
      </div>
      <div class="dp-photos">
        <label>${ic('camera')} Fotos da atividade</label>
        <div class="photo-grid">
          ${(a.fotos||[]).map(p=>`
            <div class="photo-tile">
              <img src="${blobUrl(p.id)}" alt="foto da atividade" onclick="openLightbox('${p.id}','${esc(p.legenda||'')}')">
              <button class="p-remove" onclick="removePhoto('${a._k}','${p.id}')">${ic('x')}</button>
            </div>
          `).join('')}
          ${canPhoto ? `
            <label class="photo-add-tile">
              ${ic('camera')}<span>Adicionar</span>
              <input type="file" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event,'${a._k}')">
            </label>` : ''}
        </div>
        ${(a.fotos||[]).length ? `
          <div style="display:grid;gap:6px;margin-top:6px;">
            ${(a.fotos||[]).map(p=>`<input class="photo-cap-input" placeholder="Legenda da foto" value="${esc(p.legenda)}" oninput="updatePhotoField('${a._k}','${p.id}',this.value)">`).join('')}
          </div>` : ''}
        ${!canPhoto ? `<p class="section-sub" style="margin-top:6px;">Anexar fotos requer permissão de edição${usingLocalFallback?' (não disponível no modo local deste navegador)':''}.</p>` : ''}
      </div>
    </div>
    <div class="field-grid g2" style="margin-top:8px;">
      <div class="field"><label>Status</label><select class="select" onchange="updateArrayField('atividades','${a._k}','status',this.value)">${optionsWithExtra(ACT_STATUS,a.status)}</select></div>
      <div class="field"><label>Avanço</label>
        <div class="range-row">
          <input type="range" min="0" max="100" step="5" value="${a.percentual||0}" oninput="handlePercentInput('${a._k}', this)">
          <span class="range-val mono" id="pv-${a._k}">${a.percentual||0}%</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* ---- edição de estado do formulário ---- */
function updateField(key, value){ formState[key]=value; }
function updateClimaField(key, value){ formState.clima[key]=value; }
function updateArrayField(collection, key, field, value){
  const item=formState[collection].find(x=>x._k===key);
  if(item) item[field]=value;
}
function handlePercentInput(key, input){
  const item=formState.atividades.find(x=>x._k===key);
  if(item) item.percentual=Number(input.value);
  const lbl=document.getElementById('pv-'+key);
  if(lbl) lbl.textContent=input.value+'%';
}
function addArrayItem(collection, obj){
  obj._k=uid();
  if(collection==='atividades') obj.fotos=obj.fotos||[];
  formState[collection].push(obj);
  renderFormView();
}
function removeArrayItem(collection, key){
  formState[collection]=formState[collection].filter(x=>x._k!==key);
  renderFormView();
}
function updatePhotoField(actKey, photoId, value){
  const act=formState.atividades.find(x=>x._k===actKey);
  if(!act) return;
  const photo=(act.fotos||[]).find(p=>p.id===photoId);
  if(photo) photo.legenda=value;
}
async function handlePhotoUpload(ev, actKey){
  const files=Array.from(ev.target.files||[]);
  if(!files.length) return;
  if(!assetsCap){ toast('Anexo de fotos indisponível neste modo.', 'err'); return; }
  const act=formState.atividades.find(x=>x._k===actKey);
  if(!act) return;
  toast('Enviando '+files.length+' foto(s)...');
  let convertedCount=0, failCount=0;
  for(const file of files){
    try{
      let toUpload=file, uploadMime=file.type;
      try{
        const fixed = await ensureCompatiblePhoto(file);
        toUpload = fixed.blob; uploadMime = fixed.mime;
        if(fixed.converted) convertedCount++;
      }catch(e){
        console.warn('formato de foto incompatível, tentando enviar original', e);
      }
      const res=await assetsCap.upload(toUpload, uploadMime?{type:uploadMime}:undefined);
      act.fotos = act.fotos || [];
      act.fotos.push({id:res.id, legenda:'', _k:uid()});
    }catch(e){
      console.warn('upload falhou', e);
      failCount++;
    }
  }
  if(convertedCount) toast(convertedCount+' foto(s) convertida(s) para um formato compatível automaticamente.');
  if(failCount) toast('Falha ao enviar '+failCount+' foto(s) — formato não suportado.', 'err');
  renderFormView();
}
async function removePhoto(actKey, photoId){
  const act=formState.atividades.find(x=>x._k===actKey);
  if(!act) return;
  act.fotos = (act.fotos||[]).filter(p=>p.id!==photoId);
  renderFormView();
  if(assetsCap){
    try{ await assetsCap.delete(photoId); }catch(e){ /* ignora — nada mais aponta para o id */ }
  }
}

/* ---- salvar ---- */
function stripKeys(obj){
  const c=JSON.parse(JSON.stringify(obj));
  delete c._k;
  ['efetivo','equipamentos','atividades','ocorrencias'].forEach(coll=>{
    (c[coll]||[]).forEach(x=>{ delete x._k; delete x._row; delete x._col; delete x._sheet; if(x.fotos) x.fotos.forEach(p=>delete p._k); });
  });
  delete c.registroFotografico;
  return c;
}
async function saveForm(status){
  if(!formState.obra || !formState.data){
    toast('Informe ao menos a obra e a data.', 'err');
    return;
  }
  const payload = stripKeys(formState);
  payload.status = status;
  payload.atualizadoEm = new Date().toISOString();
  if(!editingId){
    payload.criadoEm = new Date().toISOString();
    payload.criadoPor = claudeUser.id || null;
  }
  delete payload.id;

  try{
    if(dbCap && !usingLocalFallback){
      if(editingId){
        await dbCap.collection('rdos').doc(editingId).set(payload);
      } else {
        await dbCap.collection('rdos').add(payload);
      }
    } else {
      if(editingId){
        const idx=rdos.findIndex(r=>r.id===editingId);
        if(idx>=0) rdos[idx]=Object.assign({id:editingId}, payload);
      } else {
        rdos.unshift(Object.assign({id:uid()}, payload));
      }
      persistLocal();
      demoMode = rdos.length===0;
    }
    toast(status==='emitido' ? 'RDO emitido com sucesso.' : 'Rascunho salvo.');
    editingId=null; formState=null;
    setView('diario');
  }catch(e){
    console.warn('erro ao salvar', e);
    toast('Não foi possível salvar. Tente novamente.', 'err');
  }
}

async function doDelete(id){
  confirmingDeleteId=null;
  try{
    if(dbCap && !usingLocalFallback){
      await dbCap.collection('rdos').doc(id).delete();
    } else {
      rdos=rdos.filter(r=>r.id!==id);
      persistLocal();
      demoMode = rdos.length===0;
      renderCurrentView();
    }
    toast('RDO excluído.');
  }catch(e){
    toast('Não foi possível excluir.', 'err');
  }
}

/* =========================================================================
   BOOT
   ========================================================================= */
boot();
</script>
